<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#a8442a">
    <title>Carrito · Bodega Universal</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/cliente.css}">
    <script defer th:src="@{/js/comun.js}"></script>
    <script defer th:src="@{/js/publico.js}"></script>
    <script defer th:src="@{/js/cliente.js}"></script>
</head>

<body>
    <header th:replace="~{fragments/layout :: navegacionPublica}"></header>
    <main class="page">
        <div class="container">
            <div class="alert success" th:if="${exito}" th:text="${exito}">Éxito</div>
            <div class="eyebrow">TU SELECCIÓN</div>
            <h1>Tu carrito</h1>
            <p class="subline">Revisa cantidades y productos antes de confirmar tu pedido.</p>
            <div class="grid grid-main" th:if="${pedido != null and !#lists.isEmpty(pedido.lineas)}">
                <div class="card">
                    <div th:each="linea : ${pedido.lineas}" class="item-line">
                        <span class="item-icon">
                            <img class="item-photo" th:if="${!#strings.isEmpty(linea.imagenUrl)}"
                                 th:src="${linea.imagenUrl}" th:alt="${'Imagen de ' + linea.producto}" loading="lazy">
                            <span th:if="${#strings.isEmpty(linea.imagenUrl)}"
                                  th:text="${#strings.substring(linea.producto,0,1)}">P</span>
                        </span>
                        <div class="grow"><b th:text="${linea.producto}">Producto</b><br><small
                                th:text="${linea.cantidadPorVenta > 1 ? linea.cantidadPorVenta + ' por S/ ' + (linea.precioUnitario * linea.cantidadPorVenta) : 'S/ ' + linea.precioUnitario + ' c/u'}"></small>
                            <form method="post" th:action="@{/cliente/carrito/cantidad}"><input type="hidden"
                                    name="_bodega_csrf" th:value="${csrfBodega}"><input type="hidden" name="productoId"
                                    th:value="${linea.productoId}">
                                <div class="row mt2"><input class="control" style="max-width:80px;min-height:30px"
                                        type="number" th:min="${linea.cantidadPorVenta}" th:step="${linea.cantidadPorVenta}"
                                        th:value="${linea.cantidad}" name="cantidad" required><button
                                        class="btn btn-outline btn-sm" type="submit">Actualizar</button><button
                                        class="btn-link" type="submit" data-remove-line formnovalidate>Eliminar</button>
                                </div>
                            </form>
                        </div><b th:text="${'S/ ' + linea.subtotal}">Precio</b>
                    </div>
                </div>
                <aside class="card">
                    <h3>Resumen del pedido</h3>
                    <div class="summary-line"><span>Productos</span><b th:text="${#lists.size(pedido.lineas)}"></b>
                    </div>
                    <div class="summary-line"><span>Recojo en tienda</span><b>Sin costo</b></div>
                    <div class="order-total"><span>Total</span><span class="money terra"
                            th:text="${'S/ ' + pedido.total}"></span></div><a class="btn btn-block mt2"
                        th:href="@{/cliente/checkout}">Continuar a confirmar</a><a class="btn btn-outline btn-block mt2"
                        th:href="@{/productos}">Seguir comprando</a>
                </aside>
            </div>
            <div class="card empty" th:if="${pedido == null or #lists.isEmpty(pedido.lineas)}"><span
                    class="empty-icon">🛒</span>
                <h3>Tu carrito está vacío</h3><a class="btn" th:href="@{/productos}">Explorar productos</a>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
