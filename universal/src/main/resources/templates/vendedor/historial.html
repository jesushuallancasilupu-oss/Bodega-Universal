<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#a8442a">
    <title>Historial de ventas · Bodega Universal</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/vendedor.css}">
    <script defer th:src="@{/js/comun.js}"></script>
    <script defer th:src="@{/js/vendedor.js}"></script>
</head>

<body>
    <div class="work-shell">
        <aside th:replace="~{fragments/layout :: navegacionVendedor}"></aside>
        <main class="work-main">
            <div class="alert success" th:if="${exito}" th:text="${exito}">Éxito</div>
            <div class="work-heading">
                <div>
                    <h1>Historial de ventas</h1>
                    <p class="subline">Filtra por fecha y consulta cada comprobante</p>
                </div>
            </div>
            <form class="card filters" method="get" th:action="@{/vendedor/historial}"><label class="field">Desde<input
                        class="control" name="desde" type="date" th:value="${desde}"></label><label
                    class="field">Hasta<input class="control" name="hasta" type="date"
                        th:value="${hasta}"></label><button class="btn">Aplicar filtros</button></form>
            <div class="table-scroll">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Venta</th>
                            <th>Fecha</th>
                            <th>Tipo</th>
                            <th>Total</th>
                            <th>Pago</th>
                            <th>Caja</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="venta : ${ventas}">
                            <td th:text="${'V-' + venta.id}"></td>
                            <td th:text="${#temporals.format(venta.fecha,'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${venta.tipo}"></td>
                            <td th:text="${'S/ ' + venta.total}"></td>
                            <td><span class="pill" th:classappend="${venta.pagada ? ' green' : ' amber'}"
                                    th:text="${venta.pagada ? 'Pagada' : 'Pendiente'}"></span></td>
                            <td th:text="${venta.cerrada ? 'Cerrada' : 'Sin cerrar'}"></td>
                            <td><a class="btn-link" th:href="@{|/vendedor/ventas/${venta.id}|}">Detalle →</a></td>
                        </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${#lists.isEmpty(ventas)}"><span class="empty-icon">📦</span>No hay ventas
                    para este período.</div>
            </div>
        </main>
    </div>
</body>

</html>
