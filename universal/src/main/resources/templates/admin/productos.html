<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#a8442a">
    <title>Gestión de productos · Bodega Universal</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script defer th:src="@{/js/comun.js}"></script>
    <script defer th:src="@{/js/admin.js}"></script>
</head>

<body>
    <div class="work-shell">
        <aside th:replace="~{fragments/layout :: navegacionAdministrador}"></aside>
        <main class="work-main">
            <div class="alert success" th:if="${exito}" th:text="${exito}">Éxito</div>
            <div class="work-heading">
                <div>
                    <h1>Gestión de productos</h1>
                    <p class="subline">Catálogo de productos activos e inactivos</p>
                </div><a class="btn" th:href="@{/admin/productos/nuevo}">+ Nuevo producto</a>
            </div>
            <div class="card mb2"><input class="control" data-filter="#admin-productos"
                    placeholder="Buscar productos por nombre o categoría"></div>
            <div class="table-scroll">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-productos">
                        <tr th:each="producto : ${productos}" data-searchable>
                            <td><b th:text="${producto.nombre}"></b><br><small th:text="${'#' + producto.id}"></small></td>
                            <td th:text="${producto.categoria}"></td>
                            <td th:text="${producto.cantidadPorVenta > 1 ? producto.cantidadPorVenta + ' por S/ ' + (producto.precio * producto.cantidadPorVenta) : 'S/ ' + producto.precio}"></td>
                            <td th:text="${producto.stock}"></td>
                            <td><span class="pill" th:classappend="${producto.estado == 1 ? ' green' : ' red'}"
                                    th:text="${producto.estado == 1 ? 'Activo' : 'Retirado'}"></span></td>
                            <td>
                                <div class="table-actions"><a class="btn btn-outline btn-sm"
                                        th:href="@{|/admin/productos/${producto.id}/editar|}">Editar</a>
                                    <form th:if="${producto.estado == 1}" method="post"
                                        th:action="@{|/admin/productos/${producto.id}/retirar|}"
                                        data-confirm="¿Retirar producto del catálogo? Se conservará su historial.">
                                        <input type="hidden" name="_bodega_csrf" th:value="${csrfBodega}"><button
                                            class="btn btn-danger btn-sm">Retirar</button></form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${#lists.isEmpty(productos)}"><span class="empty-icon">📦</span>No se han
                    registrado productos.</div>
            </div>
        </main>
    </div>
</body>

</html>
