<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#a8442a">
    <title>Categorías · Bodega Universal</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script defer th:src="@{/js/comun.js}"></script>
    <script defer th:src="@{/js/admin.js}"></script>
</head>

<body>
    <div class="work-shell">
        <aside th:replace="~{fragments/layout :: navegacionAdministrador}"></aside>
        <main class="work-main">
            <div class="alert success" th:if="${exito}" th:text="${exito}">Éxito</div>
            <div class="work-heading">
                <div>
                    <h1>Categorías de productos</h1>
                    <p class="subline">Organiza el catálogo en panadería, pastelería y minimarket</p>
                </div>
            </div>
            <div class="grid grid-main">
                <section class="card">
                    <h3>Categorías registradas</h3>
                    <div class="item-line" th:each="categoria : ${categorias}">
                        <div class="item-icon" th:text="${#strings.substring(categoria.nombre,0,1)}">C</div>
                        <div class="grow"><b th:text="${categoria.nombre}"></b><br><small th:text="${categoria.descripcion}"></small>
                        </div><span class="pill green" th:text="${'ID ' + categoria.id}"></span>
                    </div>
                    <div class="empty" th:if="${#lists.isEmpty(categorias)}"><span class="empty-icon">📦</span>No hay
                        categorías. Crea una para registrar productos.</div>
                </section>
                <aside class="card">
                    <h3>Crear categoría</h3>
                    <form method="post" th:action="@{/admin/categorias}"><input type="hidden" name="_bodega_csrf"
                            th:value="${csrfBodega}">
                        <div class="field"><label>Nombre</label><input class="control" name="nombre" maxlength="60"
                                placeholder="Ej. Panadería" required></div>
                        <div class="field mt2"><label>Descripción</label><textarea class="control" name="descripcion"
                                maxlength="255"></textarea></div><button class="btn btn-block mt2">Crear
                            categoría</button>
                    </form><a class="btn btn-outline btn-block mt2" th:href="@{/admin/productos}">Ir a productos</a>
                </aside>
            </div>
        </main>
    </div>
</body>

</html>
