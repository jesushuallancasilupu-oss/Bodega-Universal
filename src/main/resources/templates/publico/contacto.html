<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#a8442a">
    <title>Contacto · Bodega Universal</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/publico.css}">
    <script defer th:src="@{/js/comun.js}"></script>
    <script defer th:src="@{/js/publico.js}"></script>
</head>

<body>
    <header th:replace="~{fragments/layout :: navegacionPublica}"></header>
    <main class="page">
        <div class="container">
            <div class="alert success" th:if="${exito}" th:text="${exito}">Éxito</div>
            <div class="eyebrow">VISÍTANOS</div>
            <h1>Contacto</h1>
            <div class="card">
                <h3>Bodega Universal</h3>
                <p>📍 Av. Federico Villarreal, Trujillo, Perú.</p>
                <p>Atendemos consultas y entrega de pedidos directamente en el establecimiento.</p><a class="btn"
                    th:href="@{/productos}">Ver catálogo</a>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
