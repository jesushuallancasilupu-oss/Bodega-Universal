<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#a8442a">
    <title>Crear vendedor · Bodega Universal</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script defer th:src="@{/js/comun.js}"></script>
    <script defer th:src="@{/js/admin.js}"></script>
</head>

<body>
    <div class="work-shell">
        <aside th:replace="~{fragments/layout :: navegacionAdministrador}"></aside>
        <main class="work-main">
            <div class="alert success" th:if="${exito}" th:text="${exito}">Éxito</div><a class="back"
                th:href="@{/admin/usuarios}">← Vendedores</a>
            <div class="work-heading">
                <div>
                    <h1>Crear cuenta de vendedor</h1>
                    <p class="subline">Solo los supervisores pueden realizar esta operación</p>
                </div>
            </div>
            <div class="card" style="max-width:760px">                
                <form method="post" th:action="@{/admin/usuarios/nuevo}"><input type="hidden" name="_bodega_csrf"
                        th:value="${csrfBodega}">
                    <div class="form-grid">
                        <div class="field"><label>Nombres</label><input class="control" maxlength="80" name="nombres"
                                required></div>
                        <div class="field"><label>Apellidos</label><input class="control" maxlength="80"
                                name="apellidos" required></div>
                        <div class="field"><label>DNI (8 dígitos)</label><input class="control" pattern="[0-9]{8}"
                                maxlength="8" name="dni" required></div>
                        <div class="field"><label>Teléfono</label><input class="control" name="telefono" maxlength="15"
                                required></div>
                        <div class="field wide"><label>Correo electrónico</label><input class="control" type="email"
                                name="correo" maxlength="100" required></div>
                        <div class="field wide"><label>Contraseña temporal</label><input class="control" type="password"
                                name="contrasena" minlength="8" maxlength="72" required></div>
                    </div><button class="btn mt2">Crear cuenta de vendedor</button>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
