<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#a8442a">
    <title>Ventas del negocio · Bodega Universal</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script defer th:src="@{/js/comun.js}"></script>
    <script defer th:src="@{/js/admin.js}"></script>
</head>

<body>
    <div class="work-shell">
        <aside th:replace="~{fragments/layout :: navegacionAdministrador}"></aside>
        <main class="work-main">
            <div class="alert success" th:if="${exito}" th:text="${exito}">Éxito</div>
            <div class="work-heading">
                <div>
                    <h1>Historial global de ventas</h1>
                    <p class="subline">Consulta las ventas de todos los vendedores</p>
                </div>
                <a class="btn btn-outline" th:href="@{/admin/reportes/ventas/excel(desde=${desde},hasta=${hasta})}">Descargar Excel (pagadas)</a>
            </div>
            <form class="card filters" method="get" th:action="@{/admin/ventas}"><label class="field">Desde<input
                        class="control" type="date" name="desde" th:value="${desde}"></label><label
                    class="field">Hasta<input class="control" type="date" name="hasta"
                        th:value="${hasta}"></label><button class="btn">Aplicar</button></form>
            <div class="table-scroll">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Venta</th>
                            <th>Fecha</th>
                            <th>Vendedor</th>
                            <th>Tipo</th>
                            <th>Importe</th>
                            <th>Pago</th>
                            <th>Caja</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="venta : ${ventas}">
                            <td th:text="${'V-' + venta.id}"></td>
                            <td th:text="${#temporals.format(venta.fecha,'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${venta.vendedorId}"></td>
                            <td th:text="${venta.tipo}"></td>
                            <td th:text="${'S/ ' + venta.total}"></td>
                            <td th:text="${venta.pagada ? 'Pagada' : 'Pendiente'}"></td>
                            <td th:text="${venta.cerrada ? 'Cerrada' : 'Sin cierre'}"></td>
                            <td><a class="btn-link" th:href="@{|/admin/ventas/${venta.id}|}">Ver →</a></td>
                        </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${#lists.isEmpty(ventas)}"><span class="empty-icon">📦</span>No hay ventas en
                    estas fechas.</div>
            </div>
        </main>
    </div>
</body>

</html>
