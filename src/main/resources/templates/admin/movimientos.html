<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#a8442a">
    <title>Movimientos · Bodega Universal</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script defer th:src="@{/js/comun.js}"></script>
    <script defer th:src="@{/js/admin.js}"></script>
</head>

<body>
    <div class="work-shell">
        <aside th:replace="~{fragments/layout :: navegacionAdministrador}"></aside>
        <main class="work-main">
            <div class="alert success" th:if="${exito}" th:text="${exito}">Éxito</div>
            <div class="work-heading">
                <div>
                    <h1>Historial de movimientos</h1>
                    <p class="subline">Registro completo de entradas, salidas y ajustes</p>
                </div><a class="btn btn-outline" th:href="@{/admin/inventario}">← Inventario</a>
            </div>
            <div class="card mb2"><input class="control" data-filter="#mov-table"
                    placeholder="Filtrar por producto o motivo"></div>
            <div class="table-scroll">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Producto</th>
                            <th>Tipo</th>
                            <th>Cantidad</th>
                            <th>Motivo</th>
                            <th>Supervisor</th>
                        </tr>
                    </thead>
                    <tbody id="mov-table">
                        <tr th:each="movimiento : ${movimientos}" data-searchable>
                            <td th:text="${movimiento.id}"></td>
                            <td th:text="${#temporals.format(movimiento.fecha,'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${movimiento.producto}"></td>
                            <td th:text="${movimiento.tipo}"></td>
                            <td th:text="${movimiento.cantidad}"></td>
                            <td th:text="${movimiento.motivo}"></td>
                            <td th:text="${movimiento.supervisorId}"></td>
                        </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${#lists.isEmpty(movimientos)}"><span class="empty-icon">📦</span>Aún no hay
                    movimientos.</div>
            </div>
        </main>
    </div>
</body>

</html>
