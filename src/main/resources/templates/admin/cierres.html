<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#a8442a">
    <title>Cierres de caja · Bodega Universal</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script defer th:src="@{/js/comun.js}"></script>
    <script defer th:src="@{/js/admin.js}"></script>
</head>

<body>
    <div class="work-shell">
        <aside th:replace="~{fragments/layout :: navegacionAdministrador}"></aside>
        <main class="work-main">
            <div class="alert success" th:if="${exito}" th:text="${exito}">Éxito</div>
            <div class="work-heading">
                <div>
                    <h1>Historial de cierres de caja</h1>
                    <p class="subline">Auditoría de los cierres realizados por los vendedores</p>
                </div>
            </div>
            <div class="table-scroll">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Cierre</th>
                            <th>Fecha y hora</th>
                            <th>Vendedor</th>
                            <th>Efectivo esperado</th>
                            <th>Efectivo contado</th>
                            <th>Diferencia</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cierre : ${cierres}">
                            <td th:text="${'CAJ-' + cierre.id}"></td>
                            <td th:text="${#temporals.format(cierre.fecha,'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${'USR-' + cierre.vendedorId}"></td>
                            <td th:text="${'S/ ' + cierre.esperado}"></td>
                            <td th:text="${'S/ ' + cierre.registrado}"></td>
                            <td><span class="pill" th:classappend="${cierre.diferencia.signum() == 0 ? ' green' : ' amber'}"
                                    th:text="${'S/ ' + cierre.diferencia}"></span></td>
                        </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${#lists.isEmpty(cierres)}"><span class="empty-icon">📦</span>No se
                    registraron cierres.</div>
            </div>
        </main>
    </div>
</body>

</html>
