<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#a8442a">
    <title>Punto de venta · Bodega Universal</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/vendedor.css}">
    <script defer th:src="@{/js/comun.js}"></script>
    <script defer th:src="@{/js/vendedor.js}"></script>
</head>

<body>
    <div class="work-shell">
        <aside th:replace="~{fragments/layout :: navegacionVendedor}"></aside>
        <main class="work-main">
            <div class="alert success" th:if="${exito}" th:text="${exito}">Éxito</div>
            <div class="work-heading">
                <div>
                    <h1>Nueva venta</h1>
                    <p class="subline">Venta presencial · productos y stock actualizados</p>
                </div>
            </div>
            <div class="grid grid-main">
                <section>
                    <div class="card mb2">
                        <div class="row between"><b>Buscar productos</b><small>Selección por SKU o nombre</small></div>
                        <input class="control mt2" placeholder="Buscar por nombre de producto"
                            data-filter="#pos-productos" aria-label="Buscar productos">
                    </div>
                    <div id="pos-productos" class="product-list">
                        <div class="product-option" th:each="producto : ${productos}" data-searchable>
                            <div class="item-icon" th:text="${#strings.substring(producto.nombre,0,1)}"></div>
                            <div class="grow"><b th:text="${producto.nombre}"></b><small
                                    th:text="${producto.categoria + ' · ' + (producto.cantidadPorVenta > 1 ? producto.cantidadPorVenta + ' por S/ ' + (producto.precio * producto.cantidadPorVenta) : 'S/ ' + producto.precio)}"></small></div><span
                                class="muted tiny" th:text="${producto.stock + ' unid.'}"></span><button
                                class="btn btn-outline btn-sm" type="button" data-pos-product
                                th:attr="data-id=${producto.id},data-nombre=${producto.nombre},data-precio=${producto.precio},data-stock=${producto.stock},data-incremento=${producto.cantidadPorVenta}"
                                th:disabled="${!producto.disponible}">Agregar</button>
                        </div>
                    </div>
                </section>
                <aside class="card">
                    <h3>Resumen de cobro</h3>
                    <form method="post" th:action="@{/vendedor/pos/cobrar}" data-pos><input type="hidden"
                            name="_bodega_csrf" th:value="${csrfBodega}">
                        <div id="pos-carrito" class="point-cart">
                            <p class="muted tiny">Agrega productos para comenzar.</p>
                        </div>
                        <div id="pos-hidden"></div>
                        <hr class="rule">
                        <div class="summary-line"><b>Total</b><b class="money terra" id="pos-total">S/ 0.00</b></div>
                        <div class="field mt2"><label>Método de pago</label><select id="pos-metodo" name="metodo"
                                class="control">
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="YAPE">Yape</option>
                            </select></div>
                        <div class="field mt2"><label>Importe recibido (S/)</label><input class="control"
                                id="pos-recibido" type="number" min="0" step="0.01" name="recibido" required
                                placeholder="0.00"></div>
                        <div class="summary-line"><span>Vuelto estimado</span><b id="pos-vuelto">S/ 0.00</b></div>
                        <button id="pos-submit" class="btn btn-block mt2" type="submit" disabled>Cobrar venta</button>                        
                    </form>
                </aside>
            </div>
        </main>
    </div>
</body>

</html>
